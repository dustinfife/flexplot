title: Mixed Models
name: mixedmodel
jus: '3.0'
stage: 0
compilerMode: tame
children:
- type: VariableSupplier
  persistentItems: false
  stretchFactor: 1
  children:
  - type: TargetLayoutBox
    label: Outcome Variable
    children:
    - type: VariablesListBox
      name: out
      maxItemCount: 1
      isTarget: true
  - type: TargetLayoutBox
    label: Fixed-effect Predictors
    children:
    - type: VariablesListBox
      name: preds
      isTarget: true
  - type: TargetLayoutBox
    label: Cluster Variable
    children:
    - type: VariablesListBox
      name: cluster
      maxItemCount: 1
      isTarget: true
- type: CheckBox
  name: interactions
- type: Supplier
  name: primarySupplier
  useSingleCell: true
  contentLink: (interactions)
  label: Fixed effects and interactions
  format: term
  persistentItems: true
  children:
  - type: TargetLayoutBox
    label: Fixed-effect terms
    transferAction: interactions
    children:
    - type: ListBox
      name: modelTerms
      isTarget: true
      valueFilter: unique
      template:
        type: TermLabel
- type: CheckBox
  name: polynomials
- type: Supplier
  name: quadraticSupplier
  useSingleCell: true
  contentLink: (polynomials)
  label: Squared terms
  format: variable
  persistentItems: true
  children:
  - type: TargetLayoutBox
    label: Add squared terms (numeric predictors)
    children:
    - type: VariablesListBox
      name: quadratic
      isTarget: true
      permitted: [numeric]
- type: CollapseBox
  label: Random effects and estimation
  collapsed: false
  children:
  - type: CheckBox
    name: randomIntercept
  - type: Supplier
    name: randomSupplier
    label: Selected predictors
    format: variable
    persistentItems: true
    children:
    - type: TargetLayoutBox
      label: Random slopes (correlated components)
      children:
      - type: VariablesListBox
        name: randomSlopes
        isTarget: true
  - type: ComboBox
    name: estimation
- type: CollapseBox
  label: Model Comparison
  collapsed: true
  children:
  - type: CheckBox
    name: compare
  - type: LayoutBox
    useSingleCell: true
    contentLink: (compare)
    children:
    - type: Supplier
      name: comparisonFixedSupplier
      label: Available predictors
      format: variable
      persistentItems: false
      children:
      - type: TargetLayoutBox
        label: Model 2 — Fixed Effects
        children:
        - type: VariablesListBox
          name: comparisonFixed
          isTarget: true
    - type: CheckBox
      name: comparisonInteractions
    - type: Supplier
      name: comparisonSupplier
      label: Model 2 fixed effects and interactions
      format: term
      persistentItems: true
      useSingleCell: true
      contentLink: (comparisonInteractions)
      children:
      - type: TargetLayoutBox
        label: Model 2 fixed-effect terms
        transferAction: interactions
        children:
        - type: ListBox
          name: comparisonTerms
          isTarget: true
          valueFilter: unique
          template:
            type: TermLabel
    - type: CheckBox
      name: comparisonPolynomials
    - type: Supplier
      name: comparisonQuadraticSupplier
      label: Model 2 squared terms
      format: variable
      persistentItems: true
      useSingleCell: true
      contentLink: (comparisonPolynomials)
      children:
      - type: TargetLayoutBox
        label: Add Model 2 squared terms
        children:
        - type: VariablesListBox
          name: comparisonQuadratic
          isTarget: true
          permitted: [numeric]
    - type: Label
      label: Model 2 — Random Effects
    - type: CheckBox
      name: comparisonRandomIntercept
    - type: Supplier
      name: comparisonRandomSupplier
      label: Selected predictors
      format: variable
      persistentItems: true
      children:
      - type: TargetLayoutBox
        label: Random slopes (Model 2)
        children:
        - type: VariablesListBox
          name: comparisonRandomSlopes
          isTarget: true
    - type: ComboBox
      name: comparisonEstimation
- type: CollapseBox
  label: Output Options
  collapsed: true
  children:
  - type: CheckBox
    name: includeP
  - type: CheckBox
    name: showCorrelations
- type: CollapseBox
  label: Model visualization
  collapsed: true
  children:
  - type: CheckBox
    name: graphic
  - type: ComboBox
    name: predictionType
  - type: TextBox
    name: clusters
    enable: (!predictionType:cas)
    format: number
  - type: Supplier
    name: plotSupplier
    label: Model predictors and grouping variable
    format: variable
    persistentItems: false
    children:
    - type: TargetLayoutBox
      label: Plot x variable
      children:
      - type: VariablesListBox
        name: plotX
        maxItemCount: 1
        isTarget: true
    - type: TargetLayoutBox
      label: Panel variables (up to two)
      children:
      - type: VariablesListBox
        name: plotPanels
        maxItemCount: 2
        isTarget: true
    - type: TargetLayoutBox
      label: Color / symbol variable
      children:
      - type: VariablesListBox
        name: plotGroup
        maxItemCount: 1
        isTarget: true

  - type: CollapseBox
    label: Plot Labels
    useSingleCell: true
    contentLink: (graphic)
    collapsed: true
    children:
    - type: ListBox
      name: plotLabels
      stretchFactor: 1
      columns:
      - name: display
        label: Plot element
        template:
          type: Label
      - name: label
        label: Custom label (blank = automatic)
        template:
          type: TextBox
          format: string
