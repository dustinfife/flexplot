---
name: mixedmodel
title: Mixed Model
jrs: '1.1'
refs: [flexplot, graphicalAnalysis]
items:
  - name: waiting
    title: ''
    type: Html
    content: '<p>Select a numeric outcome and one grouping variable.</p>'
  - name: specification
    title: Model specification
    type: Html
    visible: false
  - name: diagnostics
    title: Model diagnostics
    type: Html
    visible: false
  - name: fixed
    title: Fixed-effect estimates
    type: Table
    visible: false
    columns:
      - name: term
        title: Term
        type: text
      - name: estimate
        title: Estimate
        type: number
      - name: se
        title: Standard error
        type: number
      - name: lower
        title: Lower
        superTitle: 95% Wald CI
        type: number
      - name: upper
        title: Upper
        superTitle: 95% Wald CI
        type: number
      - name: t
        title: t
        type: number
      - name: p
        title: p
        type: number
        visible: (includeP)
        format: zto,pvalue
  - name: random
    title: Random-effect estimates
    type: Table
    visible: false
    columns:
      - name: group
        title: Grouping factor
        type: text
      - name: term
        title: Random-effect term
        type: text
      - name: variance
        title: Variance
        type: number
      - name: sd
        title: Standard deviation
        type: number
  - name: correlations
    title: Random-effect correlations
    type: Table
    visible: false
    columns:
      - name: term
        title: Random-effect term
        type: text
  - name: explanation
    title: Model information
    type: Html
    visible: false
  - name: plotExplanation
    title: Visualization guide
    type: Html
    visible: false
  - name: plot
    title: Model visualization
    type: Image
    width: 700
    height: 450
    visible: false
    renderFun: .plot
...
