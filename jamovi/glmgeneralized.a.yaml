---
name: glmgeneralized
title: Generalized Linear Model
menuGroup: Flexplot
version: '1.0.0'
jas: '1.2'
export: false
options:
  - name: data
    type: Data
  - name: out
    title: Outcome
    type: Variable
  - name: preds
    title: Predictors
    type: Variables
  - name: family
    title: Distribution and link
    type: List
    options:
      - name: gaussian
        title: Gaussian (identity)
      - name: binomial
        title: Binomial / Logistic (logit)
      - name: poisson
        title: Poisson (log)
      - name: gammaLog
        title: Gamma (log)
      - name: Gamma
        title: Gamma (inverse)
      - name: negativebinomial
        title: Negative Binomial (log)
    default: gaussian
  - name: modelTerms
    title: Model terms
    type: Terms
    default: null
  - name: quadratic
    title: Quadratic predictors
    type: Variables
    default: null
  - name: compare
    title: Compare two models
    type: Bool
    default: false
  - name: comparisonTerms
    title: Second model terms
    type: Terms
    default: null
  - name: comparisonQuadratic
    title: Second model quadratic predictors
    type: Variables
    default: null
  - name: comparisonX
    title: Comparison x variable
    type: Variable
    default: null
  - name: comparisonPanels
    title: Comparison panel variables (up to two)
    type: Variables
    default: null
  - name: graphic
    title: Model visualization
    type: Bool
    default: true
  - name: plotX
    title: Plot x variable
    type: Variable
    default: null
  - name: plotPanels
    title: Panel variables (up to two)
    type: Variables
    default: null
  - name: plotGroup
    title: Color / symbol variable
    type: Variable
    default: null
  - name: ghostLines
    title: Show ghost lines
    type: Bool
    default: false
  - name: plotStyle
    title: Binomial visualization
    type: List
    options:
      - name: auto
        title: Automatic (logistic overlay for continuous x)
      - name: raw
        title: Raw observations and model predictions
    default: auto
  - name: se
    title: Confidence intervals
    type: Bool
    default: true
  - name: showEstimates
    title: Estimates
    type: Bool
    default: true
  - name: showIRT
    title: IRT estimates
    type: Bool
    default: true
  - name: showProbabilities
    title: Marginal predicted probabilities
    type: Bool
    default: true
  - name: includeP
    title: Include p-values
    type: Bool
    default: false
  - name: interactions
    title: Include Interactions
    type: Bool
    default: false
  - name: comparisonInteractions
    title: Include Interactions
    type: Bool
    default: false
  - name: mainEffects
    hidden: true
    title: Model 1 main effects
    type: Variables
    default: null
  - name: comparisonMainEffects
    title: Model 2 main effects
    type: Variables
    default: null
  - name: interactionSpecVersion
    title: Interaction specification version
    hidden: true
    type: Integer
    default: 0
  - name: polynomials
    title: Include Polynomial Terms
    type: Bool
    default: false
  - name: comparisonPolynomials
    title: Include Polynomial Terms
    type: Bool
    default: false
  - name: plotScale
    title: Visualization scale
    type: List
    options:
      - name: probability
        title: Probability
      - name: logit
        title: Logit
    default: probability
  - name: plotLabels
    type: Array
    default: []
    template: &plotLabel
      type: Group
      elements:
        - name: key
          type: String
        - name: role
          type: String
        - name: variable
          type: String
        - name: value
          type: String
        - name: display
          type: String
        - name: label
          type: String
          default: ''
  - name: plotLabelStore
    type: Array
    default: []
    hidden: true
    template: *plotLabel
  - name: comparisonPlotLabels
    type: Array
    default: []
    template: *plotLabel
  - name: comparisonPlotLabelStore
    type: Array
    default: []
    hidden: true
    template: *plotLabel
  - name: comparisonGraphic
    title: Model comparison plot
    type: Bool
    default: true
  - name: comparisonStatistics
    title: Model comparison statistics
    type: Bool
    default: true
  - name: outputOptionsVersion
    title: Internal output options revision
    type: Integer
    default: 0
    hidden: true
  - name: comparisonSe
    title: Confidence intervals
    type: Bool
    default: true
  - name: comparisonPlotStyle
    title: Binomial visualization
    type: List
    options:
      - name: auto
        title: Automatic (logistic overlay for continuous x)
      - name: raw
        title: Raw observations and model predictions
    default: auto
  - name: comparisonPlotScale
    title: Visualization scale
    type: List
    options:
      - name: probability
        title: Probability
      - name: logit
        title: Logit
    default: probability
  - name: modifyPlotLabels
    title: Modify Plot Labels
    type: Bool
    default: false
  - name: modifyComparisonPlotLabels
    title: Modify Plot Labels
    type: Bool
    default: false
  - name: plotLabelEditorVersion
    title: Internal plot-label editor revision
    type: Integer
    default: 0
    hidden: true
...
