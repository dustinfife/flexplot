---
name: mixedmodel
title: Mixed Models
menuGroup: Flexplot
version: '1.0.0'
jas: '1.2'
export: false
options:
  - name: data
    type: Data
  - name: out
    title: Outcome
    type: Variable
  - name: preds
    title: Fixed-effect predictors
    type: Variables
  - name: interactions
    title: Include Interaction Terms
    type: Bool
    default: false
  - name: polynomials
    title: Include Polynomial Terms
    type: Bool
    default: false
  - name: modelTerms
    title: Fixed-effect terms
    type: Terms
    default: null
  - name: quadratic
    title: Quadratic predictors
    type: Variables
    default: null
  - name: cluster
    title: Cluster variable
    type: Variable
    default: null
  - name: randomIntercept
    title: Random intercept
    type: Bool
    default: true
  - name: randomSlopes
    title: Random slopes
    type: Variables
    default: null
  - name: estimation
    title: Estimation
    type: List
    options:
      - name: REML
        title: REML
      - name: ML
        title: Maximum likelihood (ML)
    default: REML
  - name: compare
    title: Compare two models
    type: Bool
    default: false
  - name: comparisonFixed
    title: Model 2 fixed-effect predictors
    type: Variables
    default: null
  - name: comparisonTerms
    title: Model 2 fixed-effect terms
    type: Terms
    default: null
  - name: comparisonInteractions
    title: Include Interaction Terms
    type: Bool
    default: false
  - name: comparisonPolynomials
    title: Include Polynomial Terms
    type: Bool
    default: false
  - name: comparisonQuadratic
    title: Model 2 quadratic predictors
    type: Variables
    default: null
  - name: comparisonRandomIntercept
    title: Model 2 random intercept
    type: Bool
    default: true
  - name: comparisonRandomSlopes
    title: Model 2 random slopes
    type: Variables
    default: null
  - name: comparisonEstimation
    title: Model 2 estimation
    type: List
    options:
      - name: REML
        title: REML
      - name: ML
        title: Maximum likelihood (ML)
    default: REML
  - name: includeP
    title: Include p-values (where available)
    type: Bool
    default: false
  - name: showCorrelations
    title: Random-effect correlations
    type: Bool
    default: false
  - name: graphic
    title: Model visualization
    type: Bool
    default: true
  - name: predictionType
    title: Predictions
    type: List
    options:
      - name: population
        title: Population-level (exclude random effects)
      - name: cas
        title: Cluster-adjusted scatterplot (remove estimated random effects)
      - name: cluster
        title: Cluster-specific (include estimated random effects)
    default: cluster
  - name: clusters
    title: Number of displayed clusters
    type: Integer
    default: 3
    min: 1
    max: 20
  - name: plotX
    title: Plot x variable
    type: Variable
    default: null
  - name: plotPanels
    title: Panel variables (up to two)
    type: Variables
    default: null
  - name: plotGroup
    title: Color / symbol variable
    type: Variable
    default: null
  - name: plotLabels
    title: Plot Labels
    type: Array
    default: []
    template: &plotLabel
      type: Group
      elements:
        - name: key
          type: String
        - name: role
          type: String
        - name: variable
          type: String
        - name: value
          type: String
        - name: display
          type: String
        - name: label
          type: String
          default: ''
  - name: plotLabelStore
    type: Array
    hidden: true
    default: []
    template: *plotLabel
...
