---
name:  glmbasic
title: Linear Model
menuGroup: Flexplot
version: '1.0.0'
jas: '1.2'
# Keep the public R wrapper in R/glmbasic.R when regenerating R6 classes.
export: false

options:
    - name: data
      type: Data

    - name: out
      title: Dependent variable
      type: Variable

    - name: preds
      title: Predictor variable
      type: Variables

    - name: graphic
      title: Analysis graphs
      type: Bool
      default: true
      
    - name: graphicassump
      title: Diagnostics
      type: Bool
      default: false      
     
    - name: estimates
      title: Estimates and effect eizes
      type: Bool
      default: true 
      
    - name: se
      title: Standard errors
      type: Bool
      default: true           
       
    - name: line
      title: Fitted line (for scatterplots)
      type: List
      options:
        - "Loess"
        - "Regression"
        - "Logistic"
      default: "Loess"           
      
    - name: center
      title: Center/spread (for dot plots)
      type: List
      options:
        - "Median + quartiles"
        - "Mean + sterr"
        - "Mean + stdev"
      default: "Median + quartiles"                 
      
            
           
    - name: modelTerms
      title: Primary model terms
      type: Terms
      default: null
      description: Main effects and interactions. NULL retains the additive model; an empty list fits an intercept only.

    - name: compare
      title: Compare two models
      type: Bool
      default: false
      description: Fit and compare two models on the same complete observations.

    - name: comparisonTerms
      title: Second model terms
      type: Terms
      default: null
      description: Independent main effects and interactions for Model 2. NULL uses all selected main effects.

    - name: comparisonX
      title: Comparison x variable
      type: Variable
      default: null
      description: Predictor used on the comparison x axis; defaults to the first numeric model predictor, otherwise the first model predictor.

    - name: comparisonPanels
      title: Comparison panel variables (up to two)
      type: Variables
      default: null
      description: Additional model predictors displayed in panels, not on a second axis.
    - name: plotX
      title: Plot x variable (automatic if empty)
      type: Variable
      default: null
      description: Visualization variables must occur in the fitted model terms (either model for comparisons).
    - name: plotPanels
      title: Plot panel variables (up to two)
      type: Variables
      default: null
      description: Visualization variables must occur in the fitted model terms (either model for comparisons).
    - name: plotGroup
      title: Plot grouping variable
      type: Variable
      default: null
      description: Visualization variables must occur in the fitted model terms (either model for comparisons).
    - name: comparisonGroup
      title: Comparison grouping variable (magnet plots only)
      type: Variable
      default: null
      description: Visualization variables must occur in the fitted model terms (either model for comparisons).
...
