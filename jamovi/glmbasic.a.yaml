---
name:  glmbasic
title: Linear Model
menuGroup: Flexplot
version: '1.0.0'
jas: '1.2'
# Keep the public R wrapper in R/glmbasic.R when regenerating R6 classes.
export: false

options:
    - name: data
      type: Data

    - name: out
      title: Dependent variable
      type: Variable

    - name: preds
      title: Predictor variable
      type: Variables

    - name: graphic
      title: Model visualization
      type: Bool
      default: true
      
    - name: graphicassump
      title: Residual diagnostics
      type: Bool
      default: false      
     
    - name: estimates
      title: Estimates
      type: Bool
      default: true 
      
    - name: includeP
      title: Include p-values
      type: Bool
      default: false
      description: Include coefficient t-test p-values in the estimates table.

    - name: se
      title: 95% confidence intervals (Model 1 plot)
      type: Bool
      description: Show 95% confidence intervals in the Model 1 plot; comparison and diagnostic plots are unchanged.
      default: true           
       
    # Retained for saved-analysis compatibility; not used by model visualization.
    - name: line
      hidden: true
      title: Fitted line (for scatterplots)
      type: List
      options:
        - "Loess"
        - "Regression"
        - "Logistic"
      default: "Loess"           
      
    # Retained for saved-analysis compatibility; not used by model visualization.
    - name: center
      hidden: true
      title: Center/spread (for dot plots)
      type: List
      options:
        - "Median + quartiles"
        - "Mean + sterr"
        - "Mean + stdev"
      default: "Median + quartiles"                 
      
            
           
    - name: modelTerms
      title: Primary model terms
      type: Terms
      default: null
      description: Main effects and interactions. NULL retains the additive model; an empty list fits an intercept only.

    - name: compare
      title: Compare two models
      type: Bool
      default: false
      description: Fit and compare two models on the same complete observations.

    - name: comparisonTerms
      title: Second model terms
      type: Terms
      default: null
      description: Independent main effects and interactions for Model 2. NULL uses all selected main effects.

    - name: comparisonX
      title: Comparison x variable
      type: Variable
      default: null
      description: Predictor used on the comparison x axis; defaults to the first numeric model predictor, otherwise the first model predictor.

    - name: comparisonPanels
      title: Comparison panel variables (up to two)
      type: Variables
      default: null
      description: Additional model predictors displayed in panels, not on a second axis.
    - name: plotX
      title: Plot x variable (automatic if empty)
      type: Variable
      default: null
      description: Visualization variables must occur in the fitted model terms (either model for comparisons).
    - name: plotPanels
      title: Plot panel variables (up to two)
      type: Variables
      default: null
      description: Visualization variables must occur in the fitted model terms (either model for comparisons).
    - name: plotGroup
      title: Plot grouping variable
      type: Variable
      default: null
      description: Visualization variables must occur in the fitted model terms (either model for comparisons).
    - name: comparisonMagnet
      title: Internal comparison grouping capability
      type: Bool
      hidden: true
      default: false
    - name: comparisonGroup
      title: Comparison grouping variable (magnet plots only)
      type: Variable
      default: null
      description: Visualization variables must occur in the fitted model terms (either model for comparisons).
    - name: polynomials
      title: Include Polynomial Terms
      type: Bool
      default: false
    - name: quadratic
      title: Quadratic predictors
      type: Variables
      default: null
    - name: comparisonPolynomials
      title: Include Polynomial Terms
      type: Bool
      default: false
    - name: comparisonQuadratic
      title: Model 2 quadratic predictors
      type: Variables
      default: null
    - name: interactions
      title: Include Interactions
      type: Bool
      default: false
    - name: comparisonInteractions
      title: Include Interactions
      type: Bool
      default: false
    - name: mainEffects
      hidden: true
      title: Model 1 main effects
      type: Variables
      default: null
    - name: comparisonMainEffects
      title: Model 2 main effects
      type: Variables
      default: null
    - name: interactionSpecVersion
      title: Interaction specification version
      hidden: true
      type: Integer
      default: 0
    - name: plotLabels
      type: Array
      default: []
      template: &plotLabel
        type: Group
        elements:
          - name: key
            type: String
          - name: role
            type: String
          - name: variable
            type: String
          - name: value
            type: String
          - name: display
            type: String
          - name: label
            type: String
            default: ''
    - name: plotLabelStore
      type: Array
      default: []
      hidden: true
      template: *plotLabel
    - name: comparisonPlotLabels
      type: Array
      default: []
      template: *plotLabel
    - name: comparisonPlotLabelStore
      type: Array
      default: []
      hidden: true
      template: *plotLabel
    - name: comparisonGraphic
      title: Model comparison plot
      type: Bool
      default: true
    - name: comparisonStatistics
      title: Model comparison statistics
      type: Bool
      default: true
    - name: outputOptionsVersion
      title: Internal output options revision
      type: Integer
      default: 0
      hidden: true
...
