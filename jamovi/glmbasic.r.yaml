---
name:  glmbasic
title: Linear Model
jrs:   '1.1'

items:      
    - name: waiting
      title: ''
      type: Html
      visible: false
    - name: specification
      title: Model specification
      type: Html
      visible: false
    - name: explanation
      title: ''
      type: Html
      visible: false
    - name: plot
      title: Model Visualization
      type: Image
      width:  600
      height: 400
      renderFun: .plot 
      visible: (graphic)
    - name: plotExplanation
      title: ''
      type: Html
      visible: false
    - name: glmcat
      title: Coefficient estimates
      type: Table
      visible: (estimates)
      columns:
        - name: var
          title: Coefficient
          type: text
        - name: means
          title: Estimate
          type: number
        - name: se
          title: SE
          type: number
        - name: lower
          title: Lower
          superTitle: '95% Confidence Interval'
          type: number
        - name: upper
          title: Upper
          superTitle: '95% Confidence Interval'
          type: number
        - name: t
          title: t
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue
          visible: (includeP)
        - name: status
          title: Status
          type: text
          visible: false
    - name: factorMeans
      title: Conditional factor means
      type: Table
      columns:
        - name: var
          title: 'Variable'
          type: text      
        - name: levels
          title: 'Level'
          type: text                
        - name: means
          title: 'Estimate'
          type: number
        - name: lower
          title: 'Lower'
          superTitle: '95% Confidence Interval'
          type: number
        - name: upper
          title: 'Upper'
          superTitle: '95% Confidence Interval'
          type: number
      visible: false
    - name:  diff
      title: Difference between factor levels for categorical predictors
      type: Table
      columns:
        - name: variables
          title: 'Variable'
          type: text      
        - name: comparison
          title: 'Comparison'
          type: text                
        - name: diff
          title: 'Difference'        
          type: number
        - name: lower
          title: 'Lower'  
          superTitle: '95% Confidence Interval'      
          type: number
        - name: upper
          title: 'Upper'        
          superTitle: '95% Confidence Interval'
          type: number
        - name: cohensd
          title: "Cohen's d"
          type: number
      visible: false
    - name:  rsq
      title: R² and semi-partial R² estimates
      type: Table
      columns:
        - name: var
          title: 'Source'
          type: text                     
        - name: Estimate
          type: number                                                          
      visible: (estimates)
    - name: comparisonplot
      title: Model Comparison Visualization
      type: Image
      width: 700
      height: 450
      renderFun: .comparisonplot
      visible: (compare && comparisonGraphic)
    - name: comparison
      title: Model comparison statistics
      type: Table
      visible: (compare && comparisonStatistics)
      columns:
        - name: model
          title: Model
          type: text
        - name: n
          title: N
          type: integer
        - name: aic
          title: AIC
          type: number
        - name: bic
          title: BIC
          type: number
        - name: bayes.factor
          title: BIC Bayes factor
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: rsq
          title: R-squared
          type: number
        - name: adj.rsq
          title: Adjusted R-squared
          type: number
    - name: assumpplot
      title: Residual (diagnostic) plots
      type: Image
      width:  600
      height: 400
      renderFun: .assumpplot
      visible: (graphicassump)
    - name: methodReferences
      title: ''
      type: Html
      visible: false
      refs: [flexplot, graphicalAnalysis]
...
