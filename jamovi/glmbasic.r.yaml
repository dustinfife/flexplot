---
name:  glmbasic
title: General Linear Model
jrs:   '1.1'

items:      
    - name: assumpplot
      title: Residual (diagnostic) plots
      type: Image
      width:  600
      height: 400
      renderFun: .assumpplot       
      visible: (graphicassump)
      
    - name: plot
      title: Analysis plot
      type: Image
      width:  600
      height: 400
      renderFun: .plot 
      visible: (graphic)
      
      
    - name:  glmcat
      title: Estimates and effect sizes for categorical predictors
      type: Table
      columns:
        - name: var
          title: 'Variable'
          type: text      
        - name: levels
          title: 'Level'
          type: text                
        - name: means
          title: 'Estimate'
          type: number
        - name: lower
          title: 'Lower'
          superTitle: '95% Confidence Interval'
          type: number
        - name: upper
          title: 'Upper'
          superTitle: '95% Confidence Interval'
          type: number
      visible: (estimates)
      
    - name:  diff
      title: Difference between factor levels for categorical predictors
      type: Table
      columns:
        - name: variables
          title: 'Variable'
          type: text      
        - name: comparison
          title: 'Comparison'
          type: text                
        - name: diff
          title: 'Difference'        
          type: number
        - name: lower
          title: 'Lower'  
          superTitle: '95% Confidence Interval'      
          type: number
        - name: upper
          title: 'Upper'        
          superTitle: '95% Confidence Interval'
          type: number
        - name: cohensd
          title: "Cohen's d"
          type: number
      visible: (estimates)      
          
    - name:  rsq
      title: R² and semi-partial R² estimates
      type: Table
      columns:
        - name: var
          title: 'Source'
          type: text                     
        - name: Estimate
          type: number                                                          
      visible: (estimates)   
    - name: comparisonplot
      title: Model comparison plot
      type: Image
      width: 700
      height: 450
      renderFun: .comparisonplot
      visible: (compare)

    - name: comparison
      title: Model comparison statistics
      type: Table
      visible: (compare)
      columns:
        - name: model
          title: Model
          type: text
        - name: n
          title: N
          type: integer
        - name: aic
          title: AIC
          type: number
        - name: bic
          title: BIC
          type: number
        - name: bayes.factor
          title: BIC Bayes factor
          type: number
        - name: p
          title: p (nested F-test)
          type: number
          format: zto,pvalue
        - name: rsq
          title: R-squared
          type: number
        - name: adj.rsq
          title: Adjusted R-squared
          type: number
...
