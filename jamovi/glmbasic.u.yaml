title: Linear Model
name: glmbasic
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome Variable
        children:
          - type: VariablesListBox
            name: out
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Predictor Variable(s)
        children:
          - type: VariablesListBox
            name: preds
            isTarget: true
  - type: CheckBox
    name: interactions
  - type: Supplier
    name: primarySupplier
    useSingleCell: true
    contentLink: (interactions)
    label: Interaction terms
    format: term
    persistentItems: true
    higherOrders: true
    children:
      - type: TargetLayoutBox
        label: Primary model terms
        transferAction: interactions
        children:
          - type: ListBox
            name: modelTerms
            isTarget: true
            valueFilter: unique
            template:
              type: TermLabel
  - type: CheckBox
    name: polynomials
  - type: Supplier
    name: quadraticSupplier
    useSingleCell: true
    contentLink: (polynomials)
    label: Squared terms
    format: variable
    persistentItems: true
    children:
      - type: TargetLayoutBox
        label: Add squared terms (numeric predictors)
        children:
          - type: VariablesListBox
            name: quadratic
            isTarget: true
            permitted: [numeric]
  - type: CollapseBox
    label: Model Comparison
    collapsed: true
    children:
      - type: CheckBox
        name: compare
      - type: Label
        label: Model 2 fixed effects
        useSingleCell: true
        contentLink: (compare)
        children:
          - type: Supplier
            name: comparisonMainSupplier
            label: Available main effects
            format: variable
            persistentItems: true
            children:
              - type: TargetLayoutBox
                label: Model 2 main effects
                children:
                  - type: VariablesListBox
                    name: comparisonMainEffects
                    isTarget: true
          - type: CheckBox
            name: comparisonInteractions
          - type: Supplier
            name: comparisonSupplier
            useSingleCell: true
            contentLink: (comparisonInteractions)
            label: Interaction terms
            format: term
            persistentItems: true
            higherOrders: true
            children:
              - type: TargetLayoutBox
                label: Second model terms
                transferAction: interactions
                children:
                  - type: ListBox
                    name: comparisonTerms
                    isTarget: true
                    valueFilter: unique
                    template:
                      type: TermLabel
      - type: Label
        label: Model 2 polynomial terms
        useSingleCell: true
        contentLink: (compare)
        children:
          - type: CheckBox
            name: comparisonPolynomials
          - type: Supplier
            name: comparisonQuadraticSupplier
            useSingleCell: true
            contentLink: (comparisonPolynomials)
            label: Model 2 squared terms
            format: variable
            persistentItems: true
            children:
              - type: TargetLayoutBox
                label: Add Model 2 squared terms
                children:
                  - type: VariablesListBox
                    name: comparisonQuadratic
                    isTarget: true
                    permitted: [numeric]
      - type: Supplier
        name: comparisonPlotSupplier
        label: Predictors in either model
        format: variable
        persistentItems: true
        children:
          - type: TargetLayoutBox
            label: Comparison x variable
            children:
              - type: VariablesListBox
                name: comparisonX
                maxItemCount: 1
                isTarget: true
                enable: (compare)
          - type: TargetLayoutBox
            label: Comparison panel variables (up to two)
            children:
              - type: VariablesListBox
                name: comparisonPanels
                maxItemCount: 2
                isTarget: true
                enable: (compare)
          - type: TargetLayoutBox
            name: comparisonGroupingLayout
            label: Magnet comparison grouping
            useSingleCell: true
            contentLink: (compare)
            children:
              - type: VariablesListBox
                name: comparisonGroup
                maxItemCount: 1
                isTarget: true
                enable: (compare)
      - type: CollapseBox
        label: Plot Labels
        useSingleCell: true
        contentLink: (compare)
        collapsed: true
        children:
          - type: ListBox
            name: comparisonPlotLabels
            stretchFactor: 1
            columns:
              - name: display
                label: Plot element
                template:
                  type: Label
              - name: label
                label: Custom label (blank = automatic)
                template:
                  type: TextBox
                  format: string
  - type: CollapseBox
    label: Model visualization layout
    collapsed: true
    children:
      - type: Supplier
        name: plotSupplier
        label: Predictors in the model
        format: variable
        persistentItems: false
        children:
          - type: TargetLayoutBox
            label: Plot x variable (automatic if empty)
            children:
              - type: VariablesListBox
                name: plotX
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Panel variables
            children:
              - type: VariablesListBox
                name: plotPanels
                maxItemCount: 2
                isTarget: true
          - type: TargetLayoutBox
            label: Grouping variable
            children:
              - type: VariablesListBox
                name: plotGroup
                maxItemCount: 1
                isTarget: true
      - type: CollapseBox
        label: Plot Labels
        useSingleCell: true
        contentLink: (graphic)
        collapsed: true
        children:
          - type: ListBox
            name: plotLabels
            stretchFactor: 1
            columns:
              - name: display
                label: Plot element
                template:
                  type: Label
              - name: label
                label: Custom label (blank = automatic)
                template:
                  type: TextBox
                  format: string
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 0
        children:
          - type: Label
            label: Output Options
            children:
              - type: CheckBox
                name: graphic
              - type: CheckBox
                name: graphicassump
              - type: CheckBox
                name: estimates
              - type: CheckBox
                name: includeP
  - type: LayoutBox
    margin: large
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 0
        children:
          - type: Label
            label: Graphic Options    
            children:
              - type: CheckBox
                name: se
