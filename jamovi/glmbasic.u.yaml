title: General Linear Model
name: glmbasic
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome Variable
        children:
          - type: VariablesListBox
            name: out
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Predictor Variable(s)
        children:
          - type: VariablesListBox
            name: preds
            isTarget: true
  - type: Supplier
    name: primarySupplier
    label: Selected predictors
    format: term
    persistentItems: true
    higherOrders: true
    children:
      - type: TargetLayoutBox
        label: Primary model terms
        transferAction: interactions
        children:
          - type: ListBox
            name: modelTerms
            isTarget: true
            valueFilter: unique
            template:
              type: TermLabel
  - type: CollapseBox
    label: Model Comparison
    collapsed: true
    children:
      - type: CheckBox
        name: compare
      - type: Supplier
        name: comparisonSupplier
        label: Selected predictors
        format: term
        persistentItems: true
        higherOrders: true
        children:
          - type: TargetLayoutBox
            label: Second model terms
            transferAction: interactions
            children:
              - type: ListBox
                name: comparisonTerms
                isTarget: true
                enable: (compare)
                valueFilter: unique
                template:
                  type: TermLabel
      - type: VariableSupplier
        persistentItems: false
        children:
          - type: TargetLayoutBox
            label: Comparison x variable
            children:
              - type: VariablesListBox
                name: comparisonX
                maxItemCount: 1
                isTarget: true
                enable: (compare)
          - type: TargetLayoutBox
            label: Comparison panel variables (up to two)
            children:
              - type: VariablesListBox
                name: comparisonPanels
                maxItemCount: 2
                isTarget: true
                enable: (compare)
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 0
        children:
          - type: Label
            label: Output Options
            children:
              - type: CheckBox
                name: graphic
              - type: CheckBox
                name: graphicassump
              - type: CheckBox
                name: estimates
  - type: LayoutBox
    margin: large
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 0
        children:
          - type: Label
            label: Graphic Options    
            children:
              - type: CheckBox
                name: se            
              - type: ComboBox
                name: line
              - type: ComboBox
                name: center
