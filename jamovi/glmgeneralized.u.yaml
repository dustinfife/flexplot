title: Generalized Linear Model
name: glmgeneralized
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome Variable
        children:
          - type: VariablesListBox
            name: out
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Predictor Variable(s)
        children:
          - type: VariablesListBox
            name: preds
            isTarget: true
  - type: CheckBox
    name: interactions
  - type: Supplier
    name: primarySupplier
    useSingleCell: true
    contentLink: (interactions)
    label: Fixed effects and interactions
    format: term
    persistentItems: true
    children:
      - type: TargetLayoutBox
        label: Model terms
        transferAction: interactions
        children:
          - type: ListBox
            name: modelTerms
            isTarget: true
            valueFilter: unique
            template:
              type: TermLabel
  - type: CheckBox
    name: polynomials
  - type: Supplier
    name: quadraticSupplier
    useSingleCell: true
    contentLink: (polynomials)
    label: Squared terms
    format: variable
    persistentItems: true
    children:
      - type: TargetLayoutBox
        label: Add squared terms (numeric predictors)
        children:
          - type: VariablesListBox
            name: quadratic
            isTarget: true
            permitted: [numeric]
  - type: CollapseBox
    label: Model Comparison
    collapsed: true
    children:
      - type: CheckBox
        name: compare
      - type: Label
        label: Model 2 fixed effects
        useSingleCell: true
        contentLink: (compare)
        children:
          - type: Supplier
            name: comparisonMainSupplier
            label: Available main effects
            format: variable
            persistentItems: true
            children:
              - type: TargetLayoutBox
                label: Model 2 main effects
                children:
                  - type: VariablesListBox
                    name: comparisonMainEffects
                    isTarget: true
          - type: CheckBox
            name: comparisonInteractions
          - type: Supplier
            name: comparisonSupplier
            useSingleCell: true
            contentLink: (comparisonInteractions)
            label: Interaction terms
            format: term
            persistentItems: true
            children:
              - type: TargetLayoutBox
                label: Second model terms
                transferAction: interactions
                children:
                  - type: ListBox
                    name: comparisonTerms
                    isTarget: true
                    valueFilter: unique
                    template:
                      type: TermLabel
          - type: CheckBox
            name: comparisonPolynomials
          - type: Supplier
            name: comparisonQuadraticSupplier
            useSingleCell: true
            contentLink: (comparisonPolynomials)
            label: Squared terms
            format: variable
            persistentItems: true
            children:
              - type: TargetLayoutBox
                label: Add squared terms to second model (numeric predictors)
                children:
                  - type: VariablesListBox
                    name: comparisonQuadratic
                    isTarget: true
                    permitted: [numeric]
      - type: Supplier
        name: comparisonPlotSupplier
        useSingleCell: true
        contentLink: (compare)
        label: Predictors in either model
        format: variable
        persistentItems: false
        children:
          - type: TargetLayoutBox
            label: Comparison x variable
            children:
              - type: VariablesListBox
                name: comparisonX
                maxItemCount: 1
                isTarget: true
                enable: (compare)
          - type: TargetLayoutBox
            label: Comparison panel variables (up to two)
            children:
              - type: VariablesListBox
                name: comparisonPanels
                maxItemCount: 2
                isTarget: true
                enable: (compare)
  - type: ComboBox
    name: family
  - type: CollapseBox
    label: Output Options
    collapsed: false
    children:
      - type: CheckBox
        name: includeP
  - type: CollapseBox
    label: Model visualization
    collapsed: true
    children:
      - type: CheckBox
        name: graphic
      - type: Supplier
        name: plotSupplier
        label: Predictors in the model
        format: variable
        persistentItems: false
        children:
          - type: TargetLayoutBox
            label: Plot x variable
            children:
              - type: VariablesListBox
                name: plotX
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Panel variables (up to two)
            children:
              - type: VariablesListBox
                name: plotPanels
                maxItemCount: 2
                isTarget: true
          - type: TargetLayoutBox
            label: Color / symbol variable
            children:
              - type: VariablesListBox
                name: plotGroup
                maxItemCount: 1
                isTarget: true
      - type: ComboBox
        name: plotStyle
        useSingleCell: true
        contentLink: (family:binomial)
      - type: ComboBox
        name: plotScale
        useSingleCell: true
        contentLink: (family:binomial)
      - type: CheckBox
        name: se
