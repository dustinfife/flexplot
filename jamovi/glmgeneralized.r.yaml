    type: Table
    visible: false
    refs: [flexplot, graphicalAnalysis]
    columns:
      - name: term
        title: Term
        type: text
  - name: irt
    title: IRT estimates
    type: Table
    visible: false
    columns:
      - name: variable
        title: variable
        type: text
      - name: instantaneous_slope
        title: instantaneous_slope
        type: number
      - name: intercept_threshold
        title: intercept_threshold
        type: number
  - name: probabilities
    title: Marginal predicted probabilities
    type: Table
    visible: false
    columns:
      - name: Variable
        title: Variable
        type: text
      - name: Level
        title: Level
        type: text
      - name: Probability
        title: Probability
        type: number
  - name: explanation
    title: Interpretation
    type: Html
    visible: false
  - name: plotExplanation
    title: Visualization guide
    type: Html
    visible: false
  - name: plot
    title: Model visualization
    type: Image
    width: 700
    height: 450
    visible: false
    renderFun: .plot
  - name: comparison
    title: Model comparison statistics
    type: Table
    visible: false
    columns:
      - name: model
        title: Model
        type: text
      - name: n
        title: N
        type: integer
      - name: aic
        title: AIC
        type: number
      - name: bic
        title: BIC
        type: number
      - name: bayes.factor
        title: BIC Bayes factor
        type: number
      - name: lr
        title: Likelihood ratio
        type: number
      - name: df
        title: df
        type: integer
      - name: p
        title: p (nested LRT)
        type: number
        format: zto,pvalue
  - name: comparisonplot
    title: Model comparison plot
    type: Image
    width: 700
    height: 450
    visible: false
    renderFun: .comparisonplot
