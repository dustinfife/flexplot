---
name: glmgeneralized
title: Generalized Linear Model
jrs: '1.1'
items:
  - name: coefficients
    title: Raw coefficient estimates
    type: Table
    refs: [flexplot, graphicalAnalysis]
    columns:
      - name: term
        title: Term
        type: text
      - name: estimate
        title: Estimate
        type: number
      - name: se
        title: SE
        type: number
      - name: lower
        title: Lower
        superTitle: 95% Wald CI
        type: number
      - name: upper
        title: Upper
        superTitle: 95% Wald CI
        type: number
      - name: statistic
        title: t / z
        type: number
      - name: p
        title: p
        type: number
        format: zto,pvalue
  - name: fit
    title: Model fit
    type: Table
    swapRowsColumns: true
    columns:
      - name: measure
        title: Measure
        type: text
      - name: value
        title: Value
        type: number
  - name: likelihood
    title: Likelihood fit
    type: Table
    swapRowsColumns: true
    columns:
      - name: measure
        title: Measure
        type: text
      - name: value
        title: Value
        type: number
  - name: effects
    title: Family-specific estimates
    type: Table
    visible: (family != 'binomial')
    columns:
      - name: term
        title: Term
        type: text
  - name: odds
    title: Odds ratios
    type: Table
    visible: (family:binomial)
    columns:
      - name: term
        title: Term
        type: text
      - name: odds
        title: OR
        type: number
      - name: inverse
        title: Inverse OR
        type: number
  - name: irt
    title: IRT estimates
    type: Table
    visible: (family:binomial)
    columns:
      - name: variable
        title: Predictor
        type: text
      - name: slope
        title: Instantaneous slope
        type: number
      - name: threshold
        title: Probability 0.5 threshold
        type: number
  - name: standardized
    title: Standardized estimates
    type: Table
    visible: (family:binomial)
    columns:
      - name: term
        title: Term
        type: text
      - name: odds
        title: Standardized OR
        type: number
      - name: inverse
        title: Inverse standardized OR
        type: number
      - name: difference
        title: Prediction difference (+/- 1 SD)
        type: text
  - name: probabilities
    title: Marginal predicted probabilities
    type: Table
    visible: (family:binomial)
    columns:
      - name: variable
        title: Predictor
        type: text
      - name: level
        title: Level
        type: text
      - name: probability
        title: Probability
        type: number
  - name: explanation
    title: Interpretation
    type: Html
  - name: plotExplanation
    title: Visualization guide
    type: Html
    visible: (graphic)
  - name: plot
    title: Model visualization
    type: Image
    width: 700
    height: 450
    visible: (graphic)
    renderFun: .plot
...
